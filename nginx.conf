server {
  listen 80;
  client_max_body_size 6m;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  error_page 404 /404.html;

  if ($request_uri = /index.html) {
    return 301 /;
  }

  if ($request_uri ~ ^/(about|contact|order)/index\.html$) {
    return 301 /$1/;
  }

  if ($request_uri ~ ^/(about|contact|order)\.html$) {
    return 301 /$1/;
  }

  location = /404.html {
    internal;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  location = /sitemap.xml {
    return 301 /sitemap-index.xml;
  }

  location = /robots.txt {
    proxy_pass http://api:8787/api/v1/site-settings/robots.txt;
    proxy_set_header Host $http_host;
  }

  location = /_indexing-policy {
    internal;
    proxy_pass http://api:8787/api/v1/indexing-policy;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host;
  }

  location ^~ /api/ {
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  location ~ /\.(?!well-known(?:/|$)) {
    return 404;
  }

  location ~* ^/(?:wp-admin|wp-content|wp-includes|wp-login\.php|xmlrpc\.php|administrator|phpmyadmin|graphql)(?:/|$) {
    return 404;
  }

  location /admin/ {
    try_files $uri $uri/ $uri.html =404;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
  }

  location ~ ^/products/[^/]+/?$ {
    auth_request /_indexing-policy;
    auth_request_set $index_robots $upstream_http_x_robots_tag;
    add_header X-Robots-Tag $index_robots always;
    try_files $uri $uri/ /products/detail/index.html;
  }

  location ~* \.(?:php|asp|aspx|jsp|cgi|env|ini|log|sql|bak|old|swp)$ {
    return 404;
  }

  location / {
    auth_request /_indexing-policy;
    auth_request_set $index_robots $upstream_http_x_robots_tag;
    add_header X-Robots-Tag $index_robots always;
    try_files $uri $uri/ $uri.html =404;
  }

  location /_assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location ~* \.(?:webp|png|jpg|jpeg|gif|svg|woff2?|ttf)$ {
    expires 30d;
    add_header Cache-Control "public";
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
