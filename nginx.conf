server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  error_page 404 /404.html;

  if ($request_uri = /index.html) {
    return 301 /;
  }

  if ($request_uri ~ ^/(about|contact|order)/index\.html$) {
    return 301 /$1/;
  }

  if ($request_uri ~ ^/(about|contact|order)\.html$) {
    return 301 /$1/;
  }

  location = /404.html {
    internal;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  location = /sitemap.xml {
    return 301 /sitemap-index.xml;
  }

  location ~ /\.(?!well-known(?:/|$)) {
    return 404;
  }

  location ~* ^/(?:wp-admin|wp-content|wp-includes|wp-login\.php|xmlrpc\.php|administrator|admin|phpmyadmin|api|graphql)(?:/|$) {
    return 404;
  }

  location ~* \.(?:php|asp|aspx|jsp|cgi|env|ini|log|sql|bak|old|swp)$ {
    return 404;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  location /_assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location ~* \.(?:webp|png|jpg|jpeg|gif|svg|woff2?|ttf)$ {
    expires 30d;
    add_header Cache-Control "public";
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
