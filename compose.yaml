services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orenza}
      POSTGRES_USER: ${POSTGRES_USER:-orenza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orenza_local_change_me}
    volumes:
      - orenza-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orenza} -d ${POSTGRES_DB:-orenza}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: orenza-api:latest
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-orenza}:${POSTGRES_PASSWORD:-orenza_local_change_me}@db:5432/${POSTGRES_DB:-orenza}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:8080}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://orenza.ir}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-ce8cd299-d1e0-4a87-a168-43b36bc8a624}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PASSWORD_RESET_SECRET: ${PASSWORD_RESET_SECRET:-orenza-local-reset-secret}
      PASSWORD_RESET_DEBUG: ${PASSWORD_RESET_DEBUG:-false}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_LICENSE: ${KAVENEGAR_LICENSE:-}
      KAVENEGAR_PASSWORD_TEMPLATE: ${KAVENEGAR_PASSWORD_TEMPLATE:-password}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      SMS_WEBHOOK_TOKEN: ${SMS_WEBHOOK_TOKEN:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-مدیر اورنزا}
      PORT: 8787
      PAYMENT_RECEIPT_DIR: /app/data/payment-receipts
      INVOICE_SIGNATURE_DIR: /app/data/invoice-signatures
      PRODUCT_IMAGE_DIR: /app/data/product-images
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ORDER_NOTIFICATION_EMAIL: ${ORDER_NOTIFICATION_EMAIL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ORDER_CHAT_ID: ${TELEGRAM_ORDER_CHAT_ID:-}
    volumes:
      - orenza-payment-receipts:/app/data/payment-receipts
      - orenza-invoice-signatures:/app/data/invoice-signatures
      - orenza-product-images:/app/data/product-images
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8787/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      args:
        PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    image: orenza-coffee:latest
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  orenza-postgres:
  orenza-payment-receipts:
  orenza-invoice-signatures:
  orenza-product-images:
